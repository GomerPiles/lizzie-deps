name: HarfBuzz

# Pull requests build and smoke-test archives. Only main can publish a release.
on:
  pull_request:
    paths:
      - harfbuzz/**
      - zig/TOOLCHAIN
      - zig/fetch
      - .github/workflows/harfbuzz.yml
  push:
    branches: [main]
    paths:
      - harfbuzz/**
      - zig/TOOLCHAIN
      - zig/fetch
      - .github/workflows/harfbuzz.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harfbuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pin
        run: |
          set -euo pipefail
          version=$(awk '$1 == "harfbuzz" { print $2 }' harfbuzz/SOURCES)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=harfbuzz-$version-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == true ]] || { echo "$TAG is already published."; exit 1; }
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Build in progress."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-26
            zig: aarch64-macos
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
            zig: x86_64-linux
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            zig: aarch64-linux
          - target: x86_64-windows
            runner: windows-2025
            zig: x86_64-windows
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: r
          persist-credentials: false

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: command -v ninja || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build)

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: command -v ninja || brew install ninja

      # vcvars64 puts MSVC, and its CMake and Ninja, on PATH.
      - name: Enter the MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }

      - name: Install Zig
        run: |
          r/zig/fetch ${{ matrix.zig }} z --upstream-fallback
          if [[ "${{ runner.os }}" == Windows ]]; then
            unzip -q z/*.zip -d z && mv z/zig-*/ zig
          else
            mkdir zig && tar -xJf z/*.tar.xz -C zig --strip-components 1
          fi
          echo "ZIG=$PWD/zig/zig" >> "$GITHUB_ENV"

      - name: Fetch and build
        run: |
          r/harfbuzz/fetch s
          r/harfbuzz/build ${{ matrix.target }}

      - name: Package
        run: >
          cmake -D SOURCE_DIR=s -D BINARY_DIR=b -D TARGET=${{ matrix.target }}
          -D RECIPE_COMMIT=${{ github.sha }} -D OUTPUT_DIR=o -P r/harfbuzz/package.cmake

      - name: Smoke test
        run: |
          mkdir p
          (cd o && sha256sum -c ./*.sha256 && tar -xzf ./*.tar.gz -C ../p)
          r/harfbuzz/smoke ${{ matrix.target }} p/harfbuzz-*-${{ matrix.target }} b/smoke.exe

      - name: Smoke test the Windows GNU link
        if: runner.os == 'Windows'
        run: r/harfbuzz/smoke x86_64-windows-gnu p/harfbuzz-*-x86_64-windows b/smoke-gnu.exe

      - name: Attest
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: o/*.tar.gz

      - name: Upload to draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" o/*.tar.gz o/*.tar.gz.sha256 --clobber

  publish:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write notes and publish
        run: |
          set -euo pipefail
          read -r _ version commit url < <(grep '^harfbuzz ' harfbuzz/SOURCES)
          gh release download "$TAG" --pattern '*.sha256' --dir sums
          {
            printf "HarfBuzz [\`%s\`](%s/releases/tag/%s), commit [\`%s\`](%s/tree/%s).\n" \
              "$version" "${url%.git}" "$version" "$commit" "${url%.git}" "$commit"
            echo
            printf "Built by recipe [\`%s\`](https://github.com/%s/tree/%s)\n" \
              "$GITHUB_SHA" "$GH_REPO" "$GITHUB_SHA"
            echo "in [run $GITHUB_RUN_ID](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "| Archive | Bytes | SHA-256 |"
            echo "| --- | --- | --- |"
            gh release view "$TAG" --json assets \
              --jq '.assets[] | select(.name | endswith(".tar.gz")) | "\(.name) \(.size)"' |
              sort | while read -r name size; do
                echo "| \`$name\` | $size | \`$(cut -d' ' -f1 "sums/$name.sha256")\` |"
              done
            echo
            echo "Verify provenance with \`gh attestation verify <archive> --repo $GH_REPO\`."
          } > notes.md
          gh release edit "$TAG" --draft=false --notes-file notes.md
